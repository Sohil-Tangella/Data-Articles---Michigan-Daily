<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore data-driven journalism and analysis from The Michigan Daily."
    >

    <title>Data | The Michigan Daily</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <!--
    =========================================================
    Michigan Daily Article Publishing System
    File: index.html

    Responsibilities:
    - Define the public Data archive layout
    - Display site navigation
    - Provide article search and filtering controls
    - Provide containers for dynamically loaded articles
    - Display loading, empty, and error states
    - Provide pagination controls
    =========================================================
    -->


    <!-- ==========================
         Website Header
    =========================== -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="#"
                class="logo"
                aria-label="The Michigan Daily home"
            >
                The Michigan Daily
            </a>

            <nav
                class="navigation"
                aria-label="Main navigation"
            >

                <ul>

                    <li>
                        <a href="#">
                            News
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            Sports
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            Opinion
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            Arts
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            Multimedia
                        </a>
                    </li>

                    <li>
                        <a
                            href="#"
                            class="active"
                            aria-current="page"
                        >
                            Data
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- ==========================
         Main Content
    =========================== -->

    <main>

        <!-- Page Introduction -->

        <section class="page-title">

            <h1>
                Data
            </h1>

            <p>
                Explore data-driven reporting,
                analysis, and visual journalism from
                The Michigan Daily.
            </p>

        </section>


        <!-- ==========================
             Search and Filters
        =========================== -->

        <section
            class="article-controls"
            aria-label="Article search and filters"
        >

            <form
                id="article-search-form"
                class="search-form"
                role="search"
            >

                <label
                    for="article-search"
                    class="visually-hidden"
                >
                    Search articles
                </label>

                <input
                    type="search"
                    id="article-search"
                    name="search"
                    placeholder="Search articles..."
                    autocomplete="off"
                >

                <button type="submit">
                    Search
                </button>

            </form>


            <div class="filter-group">

                <label for="category-filter">
                    Category
                </label>

                <select
                    id="category-filter"
                    name="category"
                >

                    <option value="">
                        All Categories
                    </option>

                    <option value="Campus">
                        Campus
                    </option>

                    <option value="Data">
                        Data
                    </option>

                    <option value="Elections">
                        Elections
                    </option>

                    <option value="Environment">
                        Environment
                    </option>

                    <option value="Housing">
                        Housing
                    </option>

                    <option value="Transportation">
                        Transportation
                    </option>

                </select>

            </div>

        </section>


        <!-- ==========================
             Results Information
        =========================== -->

        <section
            class="results-header"
            aria-live="polite"
        >

            <p id="results-count"></p>

        </section>


        <!-- ==========================
             Status Message
        =========================== -->

        <div
            id="status-message"
            class="status-message"
            role="status"
            aria-live="polite"
        ></div>


        <!-- ==========================
             Article Results
        =========================== -->

        <section
            id="article-container"
            class="article-container"
            aria-label="Data articles"
        >

            <!--
            Article cards are dynamically
            inserted by script.js.
            -->

        </section>


        <!-- ==========================
             Empty State
        =========================== -->

        <section
            id="empty-state"
            class="empty-state"
            hidden
        >

            <h2>
                No articles found
            </h2>

            <p>
                Try changing your search or
                selecting another category.
            </p>

            <button
                id="clear-filters"
                type="button"
            >
                Clear filters
            </button>

        </section>


        <!-- ==========================
             Pagination
        =========================== -->

        <nav
            id="pagination"
            class="pagination"
            aria-label="Article pagination"
        >

            <!--
            Pagination controls are dynamically
            generated by script.js.
            -->

        </nav>

    </main>


    <!-- ==========================
         Footer
    =========================== -->

    <footer class="site-footer">

        <p>
            &copy; 2026 The Michigan Daily
        </p>

    </footer>


    <!-- ==========================
         Frontend JavaScript
    =========================== -->

    <script src="script.js"></script>

</body>

</html>
